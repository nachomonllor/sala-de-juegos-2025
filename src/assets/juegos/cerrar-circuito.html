<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cerrar el Circuito</title>
<style>
/* Estilos con anidamiento estilo SCSS (CSS nesting nativo, no requiere compilar) */
:root{
  --bg:#0b1620; --bg2:#12263a; --pcb:#0c2f27; --pcb-line:#164a3c;
  --plate:#25423b; --plate-hi:#335a50; --plate-lo:#162a25; --plate-lock:#2e3440;
  --casing:#0d1412; --channel:#3a4744; --on:#00e5ff; --on-soft:#7ff3ff; --bulb:#ffd54a;
  --text:#e6f6ff; --muted:#8fb3c4; --ok:#5ef08a; --warn:#ffb300;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);
  display:flex;flex-direction:column;align-items:center;padding:14px 12px 20px;overflow-x:hidden}
header{width:100%;max-width:560px;text-align:center;margin-bottom:10px;position:relative;
  h1{font-size:clamp(1.1rem,5.2vw,1.6rem);padding:0 44px;letter-spacing:2px;color:var(--on);text-shadow:0 0 12px rgba(0,229,255,.55)}
  .lvl{font-size:.95rem;color:var(--muted);margin-top:2px;letter-spacing:1px; b{color:var(--text)}}
  .stats{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:.9rem;color:var(--muted);
    span b{color:var(--text)}}
  #mute{position:absolute;top:0;right:0;padding:6px 10px;font-size:1.1rem;background:transparent;border:1px solid #2a4a5c;box-shadow:none}
}
#message{min-height:24px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:10px;transition:color .3s;
  &.warn{color:var(--warn)} &.win{color:var(--ok)} &.err{color:#ff6b6b}}
button{background:#1f6feb;color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:.95rem;font-weight:700;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,filter .2s;font-family:inherit;
  &:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  &:hover{filter:brightness(1.12)}
  &.ghost{background:#1b3242} &.green{background:#1e9e57} &.amber{background:#c98a00}
}
#frame{position:relative;padding:10px;border-radius:12px;
  border:7px solid transparent;
  border-image:repeating-linear-gradient(-45deg,#ffb300,#ffb300 14px,#111 14px,#111 28px) 12;
  background:var(--pcb);
  background-image:radial-gradient(var(--pcb-line) 1.2px,transparent 1.4px);background-size:14px 14px;
  box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 25px rgba(0,0,0,.5);
  transition:box-shadow .4s;
  &.won{box-shadow:0 0 50px rgba(0,229,255,.55),0 18px 40px rgba(0,0,0,.6),inset 0 0 25px rgba(0,229,255,.25);animation:pulse .5s ease-out}
}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
#board{display:grid;gap:4px}
.tile{position:relative;border-radius:7px;aspect-ratio:1;cursor:pointer;
  background:linear-gradient(145deg,var(--plate-hi),var(--plate) 45%,var(--plate-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.45);
  transition:transform .1s, background .4s;
  &:active:not(.locked){transform:scale(.94)}
  &.empty{background:rgba(0,0,0,.28);box-shadow:inset 0 3px 7px rgba(0,0,0,.55);cursor:default}
  &.locked{cursor:default;background:linear-gradient(145deg,#3b4352,var(--plate-lock) 50%,#1d222b)}
  &.powered:not(.empty){background:linear-gradient(145deg,#2f5d63,#24494b 45%,#14302f)}
  .screw{position:absolute;width:9%;height:9%;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 30% 30%,#e8e8e8,#6a6a6a);box-shadow:0 1px 1px rgba(0,0,0,.6);
    &::after{content:"";position:absolute;inset:42% 15%;background:#555;border-radius:1px}
    &.tl{top:6%;left:6%} &.tr{top:6%;right:6%} &.bl{bottom:6%;left:6%} &.br{bottom:6%;right:6%}}
  .rot,.body{position:absolute;inset:0;z-index:2;pointer-events:none}
  .rot{transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
  .body{z-index:3}
  svg{width:100%;height:100%;display:block;overflow:visible}
  &.spark .rot{animation:spark .35s ease-out}
}
@keyframes spark{0%{filter:brightness(2.6) drop-shadow(0 0 10px #fff)}100%{filter:none}}
/* cables: carcasa, canal y núcleo de energía */
.casing{stroke:var(--casing);stroke-width:30;fill:none}
.channel{stroke:var(--channel);stroke-width:16;fill:none;transition:stroke .3s}
.core{stroke:var(--on);stroke-width:6;fill:none;opacity:0;stroke-dasharray:10 12;transition:opacity .25s}
.node{fill:var(--casing)} .node-in{fill:var(--channel);transition:fill .3s}
.powered{
  .channel{stroke:#0a6c7a} .node-in{fill:#0a6c7a}
  .core{opacity:1;animation:flow .7s linear infinite;filter:drop-shadow(0 0 4px var(--on))}
}
@keyframes flow{to{stroke-dashoffset:-22}}
/* batería y bombilla */
.bat-glow{opacity:0;transition:opacity .3s}
.powered .bat-glow{opacity:1}
.glass{fill:#56636b;stroke:#2a3237;stroke-width:3;transition:fill .3s}
.filament{stroke:#2a3237;stroke-width:2.5;fill:none;transition:stroke .3s}
.rays{opacity:0;transform-origin:50px 50px;transition:opacity .3s}
.tile.powered{
  .glass{fill:#fff3b0;filter:drop-shadow(0 0 10px var(--bulb)) drop-shadow(0 0 20px rgba(255,213,74,.7))}
  .filament{stroke:#ff9800}
  .rays{opacity:1;animation:spin 6s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,rgba(160,250,255,.6) 40%,transparent 75%);
  opacity:0;pointer-events:none;z-index:40;
  &.go{animation:flash .7s ease-out}}
@keyframes flash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
.modal{position:fixed;inset:0;background:rgba(5,10,16,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  &.show{display:flex;animation:fade .25s}
  .box{background:linear-gradient(#16293a,#0f1c28);border:2px solid #2a4a5c;border-radius:14px;padding:22px;width:100%;max-width:400px;
    max-height:90vh;overflow-y:auto;text-align:center;box-shadow:0 0 40px rgba(0,229,255,.15)}
  h2{color:var(--on);margin-bottom:10px;letter-spacing:1px}
  p{color:var(--muted);margin-bottom:14px;line-height:1.45}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.stars{font-size:2.4rem;letter-spacing:6px;margin:4px 0 8px;
  i{font-style:normal;color:#38505e;display:inline-block}
  i.on{color:#ffd54a;text-shadow:0 0 12px rgba(255,213,74,.8);animation:pop .4s backwards}
  i:nth-child(2){animation-delay:.15s} i:nth-child(3){animation-delay:.3s}}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-bottom:14px;
  button{padding:8px 0;font-size:1rem;background:#1b3242;display:flex;flex-direction:column;align-items:center;gap:2px;
    small{font-size:.7rem;color:#ffd54a;letter-spacing:1px;min-height:.9em}
    &.cur{outline:2px solid var(--on)}}}
.help-list{text-align:left;
  .rule{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #22394a;font-size:.9rem;line-height:1.4;color:var(--text);
    &:last-child{border-bottom:none}
    .ic{flex:0 0 46px;height:46px}
    b{color:var(--on)}}}
</style>
</head>
<body>
<header>
  <h1>CERRAR EL CIRCUITO</h1>
  <div class="lvl" id="lvlName"></div>
  <div class="stats">
    <span>Movimientos: <b id="moves">0</b></span>
    <span>Bombillas: <b id="bulbs">0/0</b></span>
  </div>
  <button id="mute" title="Sonido">🔊</button>
</header>
<div id="message">Tocá las piezas para girarlas.</div>
<div id="frame"><div id="board"></div></div>
<div class="controls">
  <button class="amber" id="btnReset">Reiniciar</button>
  <button class="ghost" id="btnLevels">Niveles</button>
  <button class="green" id="btnHelp">¿Cómo jugar?</button>
</div>

<div id="flash"></div>
<canvas id="fx"></canvas>

<div class="modal" id="winModal"><div class="box">
  <h2>¡CIRCUITO CERRADO!</h2>
  <div class="stars" id="stars"></div>
  <p id="winText"></p>
  <div class="row">
    <button class="ghost" id="btnReplay">Repetir</button>
    <button class="green" id="btnNext">Siguiente ▶</button>
  </div>
</div></div>

<div class="modal" id="levelsModal"><div class="box">
  <h2>NIVELES</h2>
  <div id="levelGrid"></div>
  <button class="ghost" id="btnCloseLevels">Cerrar</button>
</div></div>

<div class="modal" id="helpModal"><div class="box">
  <h2>¿CÓMO JUGAR?</h2>
  <div class="help-list" id="helpList"></div>
  <button class="green" id="btnCloseHelp" style="margin-top:12px">¡Entendido!</button>
</div></div>

<script>
// =====================================================================
//  NIVELES — formato para diseñar los tuyos
//  Dibujá el circuito YA RESUELTO, una fila por string. Cada caracter es una celda:
//    B = batería            O = bombilla           . = casilla vacía
//    │ ─            (o en ASCII:  |  - )            rectas
//    └ ┌ ┐ ┘        (o en ASCII:  L  F  7  J )      codos
//    ├ ┬ ┤ ┴                                         T (3 salidas)
//    ┼              (o en ASCII:  + )                cruz (4 salidas)
//  La batería y las bombillas miran solas hacia el cable que las toca.
//  Opcional: fijas: ['fila,col', ...] deja esas piezas sin poder girar.
//  Al cargar, el juego avisa en pantalla y en la consola (F12) si un cable queda suelto.
//  Para ganar: todas las bombillas encendidas y TODAS las piezas con energía.
// =====================================================================
const LEVELS = [
 { name: 'Encendido', map: [
   'B─┐',
   '┌─┘',
   '└─O' ] },
 { name: 'Zigzag', map: [
   'B──┐',
   '┌──┘',
   '└──┐',
   'O──┘' ] },
 { name: 'Rodeo', map: [
   '┌──┐',
   '│.┌┘',
   'B.└┐',
   'O──┘' ] },
 { name: 'La serpiente', map: [
   'B───┐',
   '┌───┘',
   '└───┐',
   '┌───┘',
   '└─O..' ] },
 { name: 'Primeras ramas', map: [
   '┌┬──O',
   '│└──┐',
   '│┌──┘',
   '│└┐B┐',
   '└O└─┘' ] },
 { name: 'Doble luz', map: [
   '┌─┐O┐',
   '│.│.│',
   '│B┘┌┘',
   '├──┘O',
   '└───┘' ] },
 { name: 'Tres faroles', map: [
   'B─┐.O',
   '┌─┤┌┘',
   '│┌┘└┐',
   '││┌─┤',
   '│O│O│',
   '└─┘└┘' ] },
 { name: 'Cableado', map: [
   'O┌┐┌─O',
   '││└┘┌┐',
   '│└┐┌┘│',
   '│┌┘└┐│',
   '│└─┬┘│',
   '└──┘B┘' ] },
 { name: 'Tablero roto', map: [
   '.┌───┐',
   '┌┘┌┐.O',
   '└┐││O.',
   'B│││└┐',
   '├┘O│.│',
   '└──┴─┘' ] },
 { name: 'Derivaciones', map: [
   '┌┐┌─┐O',
   '│O│O┘│',
   '│┌┤O─┤',
   '│B│┌┐│',
   '│┌┤│││',
   '└┘└┘└┘' ] },
 { name: 'Laberinto', map: [
   '┌┬O┌┐.',
   '│└─┘└┐',
   '│┌┐┌┐│',
   '││││││',
   '││││└┘',
   '├┘│└┐O',
   'O.B.└┘' ] },
 { name: 'Fábrica', map: [
   '┌────┬┐',
   '│O──┬┤│',
   '└─B┌┘O│',
   '┌─O│┌┐│',
   '│┌O││└┤',
   '│└─┘└O│',
   '└─────┘' ] },
 { name: 'Islas', map: [
   '┌───┐.B',
   '├┐┌─┘┌┤',
   '││O.┌┘O',
   '│└┐.└┐.',
   '└┐└┐.└┐',
   'O│.│┌┐│',
   '└┘O┴┘└┘' ] },
 { name: 'Central eléctrica', map: [
   'O┌┬O┌┐O',
   '│││┌┘└┤',
   '││└┘OO│',
   '└┘┌─┼┘│',
   'B─┘┌┴─┘',
   'O┌┐└──┐',
   '└┘└───┘' ] },
 { name: 'Red urbana', map: [
   'O──┬─┐.',
   '.┌─┘┌┴┐',
   'O│┌┐│┌┘',
   '├┘│└┘└┐',
   'B.│┌──┘',
   '┌─┘│┌OO',
   '│O┬┴┘.│',
   '└O└───┘' ] },
 { name: 'Gran circuito', map: [
   '┌┐┌┐┌┬─O',
   '│││││└─┐',
   '│└┘││O┌┤',
   '├─┐│O└┘│',
   '│O│└┬─┬┘',
   '└┘└O│O┘O',
   '┌───┴─┐│',
   '└────B└┘' ] },
 { name: 'Apagón', map: [
   'O─┬─┬┐.B',
   '┌┐│┌┘└┐│',
   '│││├─┐└┘',
   '│O││.│.O',
   '│┌┘│┌┘O┤',
   '└┘.││O┌┘',
   '┌┐.│└┤└┐',
   'O└─┘.└─┘' ] },
 { name: 'Maestro electricista', map: [
   '┌───┐┌─┐',
   '│.OO││.O',
   '│.├┘└┴─┐',
   '├O└┬──┐│',
   'O┌─┴┐O││',
   '┌┘B┐└┘││',
   '│┌─┴┐.└┘',
   '│├┐.│O─┐',
   '└┘└O└──┘' ] },
];


// Sala de Juegos: si el juego corre dentro de la sala, avisa el puntaje.
function salaReport(puntaje, detalle) {
  try {
    if (window.parent !== window) window.parent.postMessage(
      { tipo: 'sala-juegos:resultado', juego: 'cerrar-circuito', puntaje: Math.round(puntaje), detalle },
      window.location.origin);
  } catch (e) {}
}

// ---------- definición de piezas ----------
const CHARS = { '│':'02','|':'02','─':'13','-':'13','└':'01','L':'01','┌':'12','F':'12','┐':'23','7':'23','┘':'03','J':'03',
  '├':'012','┬':'123','┤':'023','┴':'013','┼':'0123','+':'0123' };
const BASE = { straight:[0,2], corner:[0,1], tee:[0,1,2], cross:[0,1,2,3], battery:[0], bulb:[0] };
const PERIOD = { straight:2, corner:4, tee:4, cross:1, battery:4, bulb:4 };
const DIRS = [[-1,0],[0,1],[1,0],[0,-1]]; // N E S O
const rotPorts = (ports, r) => ports.map(p => (p + r) % 4);
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function classify(ports){
  const n = ports.length;
  const type = n === 4 ? 'cross' : n === 3 ? 'tee' : (Math.abs(ports[0] - ports[1]) === 2 ? 'straight' : 'corner');
  for (let r = 0; r < 4; r++) if (sameSet(rotPorts(BASE[type], r), ports)) return { type, rot: r };
}

// ---------- parser y validador de niveles ----------
function parseLevel(L){
  const rows = L.map.map(r => [...r]);
  const R = rows.length, C = Math.max(...rows.map(r => r.length));
  const errors = [];
  const cells = [];
  for (let r = 0; r < R; r++) { cells.push([]); for (let c = 0; c < C; c++) {
    const ch = rows[r][c] ?? '.';
    if (ch === '.' || ch === ' ') cells[r].push(null);
    else if (ch === 'B' || ch === 'b') cells[r].push({ type:'battery' });
    else if (ch === 'O' || ch === 'o') cells[r].push({ type:'bulb' });
    else if (CHARS[ch]) cells[r].push({ ...classify([...CHARS[ch]].map(Number)) });
    else { errors.push(`Caracter desconocido "${ch}" en fila ${r}, col ${c}`); cells[r].push(null); }
  }}
  const at = (r, c) => (r >= 0 && c >= 0 && r < R && c < C) ? cells[r][c] : null;
  const portsOf = p => rotPorts(BASE[p.type], p.rot);
  // batería/bombilla: miran hacia el cable que las toca
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const p = cells[r][c]; if (!p || (p.type !== 'battery' && p.type !== 'bulb')) continue;
    const hits = [];
    DIRS.forEach(([dy, dx], d) => { const n = at(r + dy, c + dx);
      if (n && n.rot !== undefined && n.type !== 'battery' && n.type !== 'bulb' && portsOf(n).includes((d + 2) % 4)) hits.push(d); });
    if (hits.length !== 1) errors.push(`${p.type === 'battery' ? 'La batería' : 'La bombilla'} en fila ${r}, col ${c} toca ${hits.length} cables (debe tocar 1)`);
    p.rot = hits[0] ?? 0;
  }
  // cada salida de cable tiene que encajar con la pieza vecina
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const p = cells[r][c]; if (!p) continue;
    for (const d of portsOf(p)) { const n = at(r + DIRS[d][0], c + DIRS[d][1]);
      if (!n || !portsOf(n).includes((d + 2) % 4)) errors.push(`Cable suelto en fila ${r}, col ${c} hacia ${'NESO'[d]}`); }
  }
  if (!cells.flat().some(p => p && p.type === 'battery')) errors.push('El nivel no tiene batería (B)');
  if (!cells.flat().some(p => p && p.type === 'bulb')) errors.push('El nivel no tiene bombilla (O)');
  const fixed = new Set(L.fijas || []);
  cells.forEach((row, r) => row.forEach((p, c) => { if (p) {
    p.sol = p.rot; p.locked = p.type === 'battery' || p.type === 'bulb' || p.type === 'cross' || fixed.has(`${r},${c}`); } }));
  return { R, C, cells, errors };
}

// ---------- gráficos (SVG apuntando al norte en rotación 0) ----------
const pipe = d => `<path class="casing" d="${d}"/><path class="channel" d="${d}"/><path class="core" d="${d}"/>`;
const node = `<circle class="node" cx="50" cy="50" r="17"/><circle class="node-in" cx="50" cy="50" r="10"/>`;
const SVG = {
  straight: `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 104')}</svg>`,
  corner:   `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 0 A50 50 0 0 0 100 50 L104 50')}</svg>`,
  tee:      `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 104')}${pipe('M50 50 L104 50')}${node}</svg>`,
  cross:    `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 104')}${pipe('M-4 50 L104 50')}${node}</svg>`,
  battery:  `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 50')}</svg>`,
  bulb:     `<svg viewBox="0 0 100 100">${pipe('M50 -4 L50 50')}</svg>`,
};
const BODY = {
  battery: `<svg viewBox="0 0 100 100">
    <rect class="bat-glow" x="22" y="22" width="56" height="56" rx="12" fill="none" stroke="#00e5ff" stroke-width="4" style="filter:drop-shadow(0 0 8px #00e5ff)"/>
    <rect x="26" y="26" width="48" height="48" rx="9" fill="#14181c" stroke="#4b555d" stroke-width="3"/>
    <rect x="26" y="26" width="48" height="12" rx="6" fill="#c62828"/>
    <polygon points="55,42 39,60 49,60 44,74 62,54 52,54" fill="#ffeb3b" stroke="#a88900" stroke-width="1.5"/>
  </svg>`,
  bulb: `<svg viewBox="0 0 100 100">
    <g class="rays" stroke="#ffd54a" stroke-width="3" stroke-linecap="round">
      ${[0,45,90,135,180,225,270,315].map(a => `<line x1="50" y1="12" x2="50" y2="4" transform="rotate(${a} 50 50)"/>`).join('')}
    </g>
    <circle class="glass" cx="50" cy="50" r="22"/>
    <path class="filament" d="M41 54 Q45 40 50 52 Q55 40 59 54"/>
    <circle cx="43" cy="43" r="5" fill="rgba(255,255,255,.35)"/>
  </svg>`,
};

// ---------- sonido (Web Audio, sintetizado: no usa archivos) ----------
const Sfx = {
  ctx: null, master: null, muted: false,
  init(){
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = .7; this.master.connect(this.ctx.destination); } catch (e) { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'sine', vol = .2, delay = 0, slideTo = null){
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, vol = .2, freq = 2000, delay = 0, q = 1){
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + delay, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  click(){ this.noise(.035, .35, 3200, 0, 2); this.tone(1800, .03, 'square', .03); },
  zap(n){ this.tone(180 + Math.min(n, 12) * 40, .14, 'sawtooth', .05, 0, 900 + Math.min(n, 12) * 60); this.noise(.08, .08, 5000, 0, .8); },
  unzap(){ this.tone(500, .18, 'sawtooth', .035, 0, 120); },
  ding(i = 0){ const f = 880 * Math.pow(2, (i % 5) * 2 / 12); this.tone(f, .6, 'sine', .16); this.tone(f * 1.5, .5, 'sine', .07, .02); },
  win(){
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => { this.tone(f, .45, 'triangle', .16, i * .085); this.tone(f * 2, .3, 'sine', .04, i * .085); });
    this.tone(1046.5, 1.2, 'sine', .12, .45); this.tone(1567.98, 1.2, 'sine', .08, .45);
    for (let i = 0; i < 8; i++) this.tone(2000 + Math.random() * 2500, .12, 'sine', .04, .5 + i * .07);
    this.noise(.6, .12, 6000, .42, .6);
  },
  error(){ this.tone(220, .25, 'square', .05); this.tone(180, .3, 'square', .05, .1); },
};

// ---------- estado ----------
const $ = id => document.getElementById(id);
const boardEl = $('board'), frameEl = $('frame');
let lvlIndex = 0, level, tiles = [], moves = 0, par = 0, won = false, prevPowered = new Set(), prevLit = 0;
let progress = {};
try { progress = JSON.parse(localStorage.getItem('circuito_progress') || '{}'); Sfx.muted = localStorage.getItem('circuito_mute') === '1'; } catch (e) {}
const save = () => { try { localStorage.setItem('circuito_progress', JSON.stringify(progress)); localStorage.setItem('circuito_mute', Sfx.muted ? '1' : '0'); } catch (e) {} };

function loadLevel(i){
  lvlIndex = i; won = false; moves = 0;
  level = parseLevel(LEVELS[i]);
  frameEl.classList.remove('won');
  const { R, C, cells } = level;
  boardEl.style.gridTemplateColumns = `repeat(${C}, 1fr)`;
  sizeBoard();
  boardEl.innerHTML = ''; tiles = [];
  // mezclar hasta que no arranque resuelto
  for (let attempt = 0; attempt < 50; attempt++) {
    cells.flat().forEach(p => { if (p && !p.locked) p.rot = Math.floor(Math.random() * 4); });
    if (!computePower().solved) break;
  }
  par = 0;
  cells.forEach((row, r) => row.forEach((p, c) => {
    const el = document.createElement('div'); el.className = 'tile';
    const t = { r, c, p, el, vis: p ? p.rot * 90 : 0 };
    if (!p) el.classList.add('empty');
    else {
      if (p.locked) el.classList.add('locked');
      el.innerHTML = '<div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>'
        + `<div class="rot" style="transform:rotate(${t.vis}deg)">${SVG[p.type]}</div>`
        + (BODY[p.type] ? `<div class="body">${BODY[p.type]}</div>` : '');
      t.rotEl = el.querySelector('.rot');
      if (!p.locked) {
        const per = PERIOD[p.type], d = ((p.sol - p.rot) % per + per) % per;
        par += Math.min(d, per - d);
        el.addEventListener('click', () => turn(t, 1));
        el.addEventListener('contextmenu', e => { e.preventDefault(); turn(t, -1); });
      }
    }
    boardEl.appendChild(el); tiles.push(t);
  }));
  $('lvlName').innerHTML = `Nivel <b>${i + 1}</b> de ${LEVELS.length} · <b>${LEVELS[i].name}</b>`;
  $('moves').textContent = 0;
  prevPowered = new Set(); prevLit = 0;
  update(true);
  if (level.errors.length) {
    console.warn('Problemas en el nivel "' + LEVELS[i].name + '":\n' + level.errors.join('\n'));
    setMsg('⚠ Nivel mal armado: ' + level.errors[0] + (level.errors.length > 1 ? ` (+${level.errors.length - 1} más, ver consola)` : ''), 'err');
  }
}

function sizeBoard(){
  const { R, C } = level;
  const maxW = Math.min(window.innerWidth - 50, 560);
  const maxH = window.innerHeight - 280;
  const cell = Math.max(30, Math.min(maxW / C, maxH / R, 96));
  boardEl.style.width = (cell * C) + 'px';
}

function turn(t, dir){
  if (won) return;
  Sfx.init();
  t.p.rot = (t.p.rot + dir + 4) % 4; t.vis += dir * 90;
  t.rotEl.style.transform = `rotate(${t.vis}deg)`;
  moves++; $('moves').textContent = moves;
  Sfx.click();
  update(false);
}

function computePower(){
  const { R, C, cells } = level, powered = new Set(), q = [];
  const portsOf = p => rotPorts(BASE[p.type], p.rot);
  cells.forEach((row, r) => row.forEach((p, c) => { if (p && p.type === 'battery') { powered.add(r * C + c); q.push([r, c]); } }));
  while (q.length) {
    const [r, c] = q.shift();
    for (const d of portsOf(cells[r][c])) {
      const nr = r + DIRS[d][0], nc = c + DIRS[d][1];
      if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;
      const n = cells[nr][nc];
      if (!n || powered.has(nr * C + nc) || !portsOf(n).includes((d + 2) % 4)) continue;
      powered.add(nr * C + nc); q.push([nr, nc]);
    }
  }
  const all = cells.flat().filter(Boolean);
  const bulbs = []; cells.forEach((row, r) => row.forEach((p, c) => { if (p && p.type === 'bulb') bulbs.push(r * C + c); }));
  const lit = bulbs.filter(k => powered.has(k)).length;
  return { powered, lit, totalBulbs: bulbs.length, solved: lit === bulbs.length && powered.size === all.length, count: powered.size, total: all.length };
}

function update(initial){
  const s = computePower(), C = level.C;
  let newly = 0;
  tiles.forEach(t => { if (!t.p) return; const k = t.r * C + t.c, on = s.powered.has(k);
    t.el.classList.toggle('powered', on);
    if (on && !prevPowered.has(k) && !initial) { newly++; t.el.classList.remove('spark'); void t.el.offsetWidth; t.el.classList.add('spark'); }
  });
  if (!initial) {
    if (s.lit > prevLit) Sfx.ding(s.lit);
    else if (newly) Sfx.zap(s.count);
    else if (s.count < prevPowered.size) Sfx.unzap();
  }
  prevPowered = s.powered; prevLit = s.lit;
  $('bulbs').textContent = `${s.lit}/${s.totalBulbs}`;
  if (s.solved && !initial) return victory();
  if (s.lit === s.totalBulbs) setMsg(`¡Todas las bombillas encendidas! Pero faltan ${s.total - s.count} piezas por energizar.`, 'warn');
  else setMsg(`Energía en ${s.count} de ${s.total} piezas.`);
}

function setMsg(t, cls = ''){ const m = $('message'); m.textContent = t; m.className = cls; }

// ---------- victoria: destello, chispas y sonido ----------
function victory(){
  won = true;
  setMsg('¡Circuito cerrado!', 'win');
  const stars = moves <= par ? 3 : moves <= par + Math.ceil(par * .5) + 2 ? 2 : 1;
  progress[lvlIndex] = Math.max(progress[lvlIndex] || 0, stars); save();
  salaReport(1000 * Math.max(par, 1) / Math.max(moves, par, 1), { nivel: lvlIndex + 1, movimientos: moves, minimo: par, estrellas: stars });
  Sfx.win();
  frameEl.classList.add('won');
  const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  // chispas desde cada bombilla y una lluvia general
  tiles.forEach(t => { if (t.p && t.p.type === 'bulb') { const b = t.el.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2, 40); } });
  const fb = frameEl.getBoundingClientRect(); burst(fb.left + fb.width / 2, fb.top + fb.height / 2, 90, true);
  setTimeout(() => {
    $('stars').innerHTML = [1, 2, 3].map(n => `<i class="${n <= stars ? 'on' : ''}">★</i>`).join('');
    $('winText').textContent = `Lo resolviste en ${moves} movimientos (mínimo posible: ${par}).`;
    $('btnNext').textContent = lvlIndex < LEVELS.length - 1 ? 'Siguiente ▶' : 'Volver al 1';
    $('winModal').classList.add('show');
  }, 1300);
}

const fx = $('fx'), g = fx.getContext('2d'); let parts = [], anim = null;
function resizeFx(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
function burst(x, y, n, big = false){
  const cols = ['#ffffff', '#00e5ff', '#7ff3ff', '#ffd54a', '#ffeb3b'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (big ? 4 : 2) + Math.random() * (big ? 9 : 6);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (big ? 2 : 1), life: 1, decay: .012 + Math.random() * .02,
      c: cols[Math.random() * cols.length | 0], w: 1.5 + Math.random() * 2.5 });
  }
  if (!anim) anim = requestAnimationFrame(tick);
}
function tick(){
  g.clearRect(0, 0, innerWidth, innerHeight);
  g.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    const px = p.x, py = p.y;
    p.vy += .18; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    g.strokeStyle = p.c; g.globalAlpha = Math.max(p.life, 0); g.lineWidth = p.w; g.lineCap = 'round';
    g.beginPath(); g.moveTo(px - p.vx * 1.5, py - p.vy * 1.5); g.lineTo(p.x, p.y); g.stroke();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  anim = parts.length ? requestAnimationFrame(tick) : null;
}

// ---------- menús ----------
function openLevels(){
  $('levelGrid').innerHTML = LEVELS.map((L, i) => {
    const s = progress[i] || 0;
    return `<button class="${i === lvlIndex ? 'cur' : ''}" data-i="${i}" title="${L.name}">${i + 1}<small>${'★'.repeat(s)}</small></button>`;
  }).join('');
  $('levelGrid').querySelectorAll('button').forEach(b => b.onclick = () => { $('levelsModal').classList.remove('show'); loadLevel(+b.dataset.i); });
  $('levelsModal').classList.add('show');
}
const icon = (type, rot = 0, on = false) => `<div class="ic tile ${on ? 'powered' : ''} ${type === 'battery' || type === 'bulb' ? 'locked' : ''}" style="cursor:default">
  <div class="rot" style="transform:rotate(${rot * 90}deg)">${SVG[type]}</div>${BODY[type] ? `<div class="body">${BODY[type]}</div>` : ''}</div>`;
$('helpList').innerHTML = [
  [icon('battery', 1, true), '<b>La batería</b> da la energía. Tu objetivo es llevarla por los cables hasta <b>todas las bombillas</b>.'],
  [icon('bulb', 3, true), '<b>Las bombillas</b> se encienden cuando les llega un cable con energía.'],
  [icon('corner', 1), '<b>Tocá una pieza</b> para girarla 90° en sentido horario. Con clic derecho gira al revés.'],
  [icon('tee', 0, true), 'Hay rectas, codos, <b>T</b> y cruces. Dos piezas se conectan solo si sus salidas quedan enfrentadas.'],
  [icon('straight', 0, true), 'Para ganar, <b>todas las piezas</b> del tablero tienen que tener energía, no solo las bombillas.'],
  [`<div class="ic" style="display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#ffd54a">★</div>`, 'Cuantos menos movimientos uses, más estrellas ganás.'],
].map(([ic, txt]) => `<div class="rule">${ic}<div>${txt}</div></div>`).join('');

$('btnReset').onclick = () => { Sfx.init(); Sfx.unzap(); loadLevel(lvlIndex); };
$('btnLevels').onclick = openLevels;
$('btnCloseLevels').onclick = () => $('levelsModal').classList.remove('show');
$('btnHelp').onclick = () => $('helpModal').classList.add('show');
$('btnCloseHelp').onclick = () => $('helpModal').classList.remove('show');
$('btnReplay').onclick = () => { $('winModal').classList.remove('show'); loadLevel(lvlIndex); };
$('btnNext').onclick = () => { $('winModal').classList.remove('show'); loadLevel((lvlIndex + 1) % LEVELS.length); };
$('mute').onclick = () => { Sfx.muted = !Sfx.muted; $('mute').textContent = Sfx.muted ? '🔇' : '🔊'; save(); Sfx.init(); Sfx.click(); };
$('mute').textContent = Sfx.muted ? '🔇' : '🔊';
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m && m.id !== 'winModal') m.classList.remove('show'); }));
window.addEventListener('resize', () => { sizeBoard(); resizeFx(); });
resizeFx();

// arrancar en el primer nivel sin resolver
let start = LEVELS.findIndex((_, i) => !progress[i]); if (start < 0) start = 0;
loadLevel(start);
try { if (!localStorage.getItem('circuito_help')) { $('helpModal').classList.add('show'); localStorage.setItem('circuito_help', '1'); } } catch (e) {}
</script>
</body>
